# Camera Intrinsic Parameters for Logitech C920 at 1080p
# Values based on common calibration results
intrinsics:
  width: 1920
  height: 1080
  fx: 1394.60
  fy: 1394.60
  cx: 995.59
  cy: 599.32
  distortion: [0.1148, -0.2195, 0.0012, 0.0086, 0.1127]

# Camera Extrinsic Parameters from CAD (in mm)
# World Coordinate System: [x, y, z] where z is up/down
cameras:
  cam1:
    position: [-128.36285, -128.36285, -128.24037]
    rotation: [0, 0, 0] # Need orientation from CAD or "point-at-center" logic
  cam2:
    position: [-128.36285, 128.36285, 128.24037]
    rotation: [0, 0, 0]
  cam3:
    position: [128.36285, 128.36285, 128.24037]
    rotation: [0, 0, 0]
